<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pépites</title>
<meta name="theme-color" content="#0f1419">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pépites">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0f1419;color:#e6edf3;font-family:system-ui,-apple-system,sans-serif}
main{min-height:100%;display:flex;flex-direction:column;gap:14px;padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom))}
a{flex:1;min-height:90px;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:18px;font-size:1.5rem;font-weight:700;text-decoration:none;color:#0f1419;padding:12px}
a:active{filter:brightness(.9)}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 6px}
h1{margin:0;font-size:1.6rem}
header a.gh{flex:none;min-height:0;display:inline-flex;gap:8px;align-items:center;padding:8px 14px;border-radius:999px;font-size:1rem;font-weight:600;color:#e6edf3;background:#1a2332;border:1px solid #2d3a4f}
header a.gh svg{width:20px;height:20px;fill:currentColor}
a .new{margin-left:10px;padding:2px 8px;border-radius:999px;background:#0f1419;color:#fff;font-size:.8rem;font-weight:700;vertical-align:middle}
.sub{margin:2px 0 0;font-size:.85rem;font-weight:500;color:#9aa8bc}
header .brand{display:flex;flex-direction:column}
.b3d{background:#6cb6ff}.bav{background:#5fd38d}.bit{background:#ffb347}.ban{background:#ffd60a}.bty{background:#c084fc}
</style>
</head>
<body>
<main>
<header><h1>Pépites 💎</h1><a class="gh" href="https://github.com/olanlive"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg><span>GitHub</span></a></header>
<a class="b3d" href="https://olanlive.github.io/revue-oss-3d/" data-blog="https://olanlive.github.io/revue-oss-3d/">Pépites 3D &amp; VFX</a>
<a class="bav" href="https://olanlive.github.io/revue-audio-video/" data-blog="https://olanlive.github.io/revue-audio-video/">Pépites Audio &amp; Vidéo</a>
<a class="bit" href="https://olanlive.github.io/revue-outils-it/" data-blog="https://olanlive.github.io/revue-outils-it/">Pépites Outils IT</a>
<a class="ban" href="https://olanlive.github.io/revue-animation/" data-blog="https://olanlive.github.io/revue-animation/">Pépites Animation</a>
<a class="bty" href="https://olanlive.github.io/revue-typographie/" data-blog="https://olanlive.github.io/revue-typographie/">Pépites Typo</a>
</main>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');</script>
<script src="nav.js"></script>
<script>
(function () {
  var lang = "fr";
  try { if (localStorage.getItem("pepites-lang") === "en") lang = "en"; } catch (e) {}
  if (lang === "en") {
    document.documentElement.lang = "en";
    var h1 = document.querySelector("main h1");
    if (h1) {
      var wrap = document.createElement("div");
      wrap.className = "brand";
      h1.parentNode.insertBefore(wrap, h1);
      wrap.appendChild(h1);
      h1.textContent = "Gems 💎";
      var sub = document.createElement("p");
      sub.className = "sub";
      sub.textContent = "Daily gems";
      wrap.appendChild(sub);
    }
    var labels = {
      "https://olanlive.github.io/revue-oss-3d/": "3D & VFX Gems",
      "https://olanlive.github.io/revue-audio-video/": "Audio & Video Gems",
      "https://olanlive.github.io/revue-outils-it/": "IT Tools Gems",
      "https://olanlive.github.io/revue-animation/": "Animation Gems",
      "https://olanlive.github.io/revue-typographie/": "Typo Gems"
    };
    [].forEach.call(document.querySelectorAll("a[data-blog]"), function (a) {
      var u = a.getAttribute("data-blog");
      if (u) a.setAttribute("href", u + "en/");
      if (labels[u]) a.textContent = labels[u];
    });
  }
  if (window.PepitesNav) PepitesNav.checkNew(function (b) {
    var a = document.querySelector('[data-blog="' + b.url + '"]');
    if (!a || a.querySelector(".new")) return;
    var s = document.createElement("span");
    s.className = "new";
    s.textContent = lang === "en" ? "new" : "nouveau";
    a.appendChild(s);
  });
})();
</script>
</body>
</html>
