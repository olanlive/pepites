<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pépites</title>
<meta name="theme-color" content="#0f1419">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pépites">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0f1419;color:#e6edf3;font-family:system-ui,-apple-system,sans-serif}
main{min-height:100%;display:flex;flex-direction:column;gap:14px;padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom))}
a{text-decoration:none}
.blogs{flex:1;display:flex;flex-direction:column;gap:14px}
/* Cartes des blogs : image de fond (--bg-img, img/*.webp) sous un voile de la couleur du blog (--veil). Contraste mini mesuré du texte #0f1419 : 3D 4,1:1 ; Audio 4,6 ; IT 4,7 ; Animation 6,2 ; Typo 4,7 (AA texte large ≥ 3:1). */
.blogs a{flex:1;min-height:90px;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:18px;font-size:1.5rem;font-weight:700;color:#0f1419;padding:12px;background-color:var(--c);background-image:linear-gradient(var(--veil),var(--veil)),var(--bg-img,none);background-size:cover;background-position:center;background-repeat:no-repeat}
.blogs a:active{filter:brightness(.9)}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 6px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.top .right{display:flex;align-items:center;gap:8px}
.top a.back{flex:none;min-height:44px;display:inline-flex;align-items:center;padding:8px 14px;border-radius:999px;font-size:1rem;font-weight:600;color:#e6edf3;background:#1a2332;border:1px solid #2d3a4f}
.lang{display:inline-flex;border:1px solid #2d3a4f;border-radius:999px;overflow:hidden;background:#1a2332}
.lang button{min-width:48px;min-height:44px;padding:0 12px;border:0;background:transparent;color:#9aa8bc;font:600 1rem system-ui,-apple-system,sans-serif;cursor:pointer;-webkit-appearance:none;appearance:none}
.lang button[aria-pressed="true"]{background:#e6edf3;color:#0f1419}
.lang button:focus-visible,.top a.back:focus-visible,a.gh:focus-visible{outline:2px solid #fff;outline-offset:2px}
h1{margin:0;font-size:1.6rem}
a.gh{flex:none;min-height:44px;display:inline-flex;gap:8px;align-items:center;padding:8px 14px;border-radius:999px;font-size:1rem;font-weight:600;color:#e6edf3;background:#1a2332;border:1px solid #2d3a4f}
a.gh svg{width:20px;height:20px;fill:currentColor}
a .new{margin-left:10px;padding:2px 8px;border-radius:999px;background:#0f1419;color:#fff;font-size:.8rem;font-weight:700;vertical-align:middle}
.sub{margin:2px 0 0;font-size:.85rem;font-weight:500;color:#9aa8bc}
header .brand{display:flex;flex-direction:column}
.b3d{--c:#6cb6ff;--veil:rgba(108,182,255,.65);--bg-img:url(img/3d-vfx.webp)}
.bav{--c:#5fd38d;--veil:rgba(95,211,141,.65);--bg-img:url(img/audio-video.webp)}
.bit{--c:#ffb347;--veil:rgba(255,179,71,.65);--bg-img:url(img/outils-it.webp)}
.ban{--c:#ffd60a;--veil:rgba(255,214,10,.65);--bg-img:url(img/animation.webp)}
.bty{--c:#c084fc;--veil:rgba(192,132,252,.78);--bg-img:url(img/typographie.webp)}
/* Grands écrans : colonne centrée de 960 px, cartes en grille */
@media (min-width:720px){
main{max-width:960px;margin:0 auto;min-height:0;padding-top:calc(24px + env(safe-area-inset-top))}
.blogs{flex:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.blogs a{min-height:150px;font-size:1.35rem;padding:20px;transition:transform .15s,filter .15s}
.blogs a:hover{filter:brightness(1.06);transform:translateY(-2px)}
}
@media (min-width:1024px){.blogs{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<main>
<div class="top"><a class="back" href="https://olanlive.github.io/" aria-label="Retour à olanlive">← olanlive</a><div class="right"><div class="lang" role="group" aria-label="Langue"><button type="button" data-lang="fr" aria-pressed="true">FR</button><button type="button" data-lang="en" aria-pressed="false">EN</button></div><a class="gh" href="https://github.com/olanlive"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg><span>GitHub</span></a></div></div>
<header><div class="brand"><h1 id="title">Pépites 💎</h1><p class="sub" id="sub" hidden>Daily gems</p></div></header>
<nav class="blogs">
<a class="b3d" href="https://olanlive.github.io/revue-oss-3d/" data-blog="https://olanlive.github.io/revue-oss-3d/">Pépites 3D &amp; VFX</a>
<a class="bav" href="https://olanlive.github.io/revue-audio-video/" data-blog="https://olanlive.github.io/revue-audio-video/">Pépites Audio &amp; Vidéo</a>
<a class="bit" href="https://olanlive.github.io/revue-outils-it/" data-blog="https://olanlive.github.io/revue-outils-it/">Pépites Outils IT</a>
<a class="ban" href="https://olanlive.github.io/revue-animation/" data-blog="https://olanlive.github.io/revue-animation/">Pépites Animation</a>
<a class="bty" href="https://olanlive.github.io/revue-typographie/" data-blog="https://olanlive.github.io/revue-typographie/">Pépites Typo</a>
</nav>
</main>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');</script>
<script src="nav.js"></script>
<script>
(function () {
  var KEY = "pepites-lang";
  var T = {
    fr: { title: "Pépites", h1: "Pépites 💎", sub: "", back: "Retour à olanlive", langGroup: "Langue", gh: "GitHub", isNew: "nouveau",
      blogs: { "https://olanlive.github.io/revue-oss-3d/": "Pépites 3D & VFX", "https://olanlive.github.io/revue-audio-video/": "Pépites Audio & Vidéo",
        "https://olanlive.github.io/revue-outils-it/": "Pépites Outils IT", "https://olanlive.github.io/revue-animation/": "Pépites Animation",
        "https://olanlive.github.io/revue-typographie/": "Pépites Typo" } },
    en: { title: "Gems", h1: "Gems 💎", sub: "Daily gems", back: "Back to olanlive", langGroup: "Language", gh: "GitHub", isNew: "new",
      blogs: { "https://olanlive.github.io/revue-oss-3d/": "3D & VFX Gems", "https://olanlive.github.io/revue-audio-video/": "Audio & Video Gems",
        "https://olanlive.github.io/revue-outils-it/": "IT Tools Gems", "https://olanlive.github.io/revue-animation/": "Animation Gems",
        "https://olanlive.github.io/revue-typographie/": "Typography Gems" } }
  };
  function load() { try { return localStorage.getItem(KEY) === "en" ? "en" : "fr"; } catch (e) { return "fr"; } }
  function save(v) { try { localStorage.setItem(KEY, v); } catch (e) {} }
  var lang = load();
  function label(a, text) {
    var dot = a.querySelector(".new");
    a.textContent = text;
    if (dot) { dot.textContent = T[lang].isNew; a.appendChild(dot); }
  }
  function apply(l) {
    lang = l; var t = T[l];
    document.documentElement.lang = l;
    document.title = t.title;
    document.getElementById("title").textContent = t.h1;
    var sub = document.getElementById("sub"); sub.textContent = t.sub; sub.hidden = !t.sub;
    var back = document.querySelector(".top a.back"); back.setAttribute("aria-label", t.back);
    document.querySelector(".lang").setAttribute("aria-label", t.langGroup);
    [].forEach.call(document.querySelectorAll(".lang button"), function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-lang") === l));
    });
    [].forEach.call(document.querySelectorAll("a[data-blog]"), function (a) {
      var u = a.getAttribute("data-blog");
      a.setAttribute("href", u + (l === "en" ? "en/" : ""));
      if (t.blogs[u]) label(a, t.blogs[u]);
    });
  }
  [].forEach.call(document.querySelectorAll(".lang button"), function (b) {
    b.addEventListener("click", function () { var l = b.getAttribute("data-lang"); save(l); apply(l); });
  });
  apply(lang);
  if (window.PepitesNav) PepitesNav.checkNew(function (b) {
    var a = document.querySelector('[data-blog="' + b.url + '"]');
    if (!a || a.querySelector(".new")) return;
    var s = document.createElement("span");
    s.className = "new";
    s.textContent = T[lang].isNew;
    a.appendChild(s);
  });
})();
</script>
</body>
</html>
